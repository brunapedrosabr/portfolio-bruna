spring.application.name=portfolio-api

# O Render define a porta pela variável PORT. Localmente, usa 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Banco de dados
# Sem variáveis de ambiente, usa H2 em memória (bom para desenvolvimento).
# Em produção, defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# e SPRING_DATASOURCE_PASSWORD com os dados do Supabase (PostgreSQL).
# ---------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# O Hibernate cria/atualiza a tabela "contatos" automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Poucas conexões: o plano gratuito do Supabase tem limite de conexões.
spring.datasource.hikari.maximum-pool-size=3

# ---------------------------------------------------------------
# Configurações da aplicação
# ---------------------------------------------------------------
# Endereços que podem chamar a API (separados por vírgula). Aceita curingas,
# ex.: https://portfolio-bruna.vercel.app,https://*.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Chave para listar as mensagens recebidas (GET /api/contatos com o cabeçalho X-Admin-Key).
# Se ficar vazia, a listagem fica desativada.
app.admin-key=${ADMIN_KEY:}
